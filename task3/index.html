<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR Task 3 - Face Tracking Mask</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #info {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">Посмотрите в фронтальную камеру</div>

  <a-scene 
    mindar-face="filterMinCF: 0.001; filterBeta: 0.1;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Невидимый окклюдер (голова-маска, скрывающая геометрию за лицом) -->
      <a-asset-item id="headModel" src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
      <!-- Модель шлема/маски -->
      <a-asset-item id="maskModel" src="../task1/assets/model.glb"></a-asset-item>
    </a-assets>

    <a-camera active="false" position="0 0 0"></a-camera>

    <!-- Скрывающий окклюдер -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model mindar-face-occluder position="0 -0.3 0.15" rotation="0 0 0" scale="0.065 0.065 0.065" src="#headModel"></a-gltf-model>
    </a-entity>

    <!-- Маска, привязанная к переносице (anchor 168) -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model 
        src="#maskModel" 
        position="0 -0.05 0.1" 
        rotation="0 0 0" 
        scale="0.07 0.07 0.07">
      </a-gltf-model>
    </a-entity>

    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" intensity="0.6" position="0 1 1"></a-light>
  </a-scene>
</body>
</html>
