cat << 'EOF'> task2/index.html
    <!DOCTYPE html>
    <html>

    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WebAR Task 2 - MindAR Image Tracking</title>
        <!-- Подключаем совместимые версии A-Frame и MindAR -->
        <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
        <style>
            body {
                margin: 0;
                overflow: hidden;
            }

            #overlay {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.75);
                color: white;
                padding: 10px 18px;
                border-radius: 20px;
                font-family: sans-serif;
                font-size: 14px;
                pointer-events: none;
                z-index: 1000;
            }
        </style>
    </head>

    <body>
        <div id="overlay">Наведите камеру на карточку card.png</div>

        <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;"
            color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false">

            <a-assets>
                <a-asset-item id="helmetModel" src="./assets/model.glb"></a-asset-item>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

            <a-entity mindar-image-target="targetIndex: 0">
                <!-- Модель шлема: масштаб и позиция подобраны под маркер -->
                <a-gltf-model rotation="0 0 0" position="0 0 0.1" scale="0.1 0.1 0.1" src="#helmetModel">
                </a-gltf-model>
            </a-entity>
        </a-scene>
    </body>

    </html>
    EOF
